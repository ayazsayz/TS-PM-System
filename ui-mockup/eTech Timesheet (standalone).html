document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

acity:1;transform:none}}\n@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}\n@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ============ LOGIN ============ -->\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Login\" style=\"min-height:100vh;min-width:1080px;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)\">\n  <div style=\"position:relative;overflow:hidden;background:#10142E;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:44px 52px\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;right:-180px;bottom:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 40%,transparent) 0%,transparent 68%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;position:relative\">\n      <div style=\"width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff\">e<\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;letter-spacing:-.01em\">eTech <span style=\"font-weight:500;color:rgba(255,255,255,.55)\">Timesheet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:520px\">\n      <h1 style=\"margin:0 0 16px;font-size:46px;line-height:1.08;font-weight:700;letter-spacing:-.025em;text-wrap:balance\">Time, accounted for.<\u002Fh1>\n      <p style=\"margin:0 0 36px;font-size:16px;line-height:1.6;color:rgba(255,255,255,.6);max-width:400px\">Log hours, track project health, and approve timesheets — in one fast, focused workspace for the whole organization.<\u002Fp>\n      <div style=\"display:flex;gap:14px;align-items:stretch\">\n        <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:12px;padding:16px 18px;min-width:160px\">\n          <div style=\"font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px\">This week<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">38.5h<\u002Fdiv>\n          <div style=\"height:5px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden\"><div style=\"width:76%;height:100%;border-radius:99px;background:var(--accent)\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:12px;padding:16px 18px;min-width:160px\">\n          <div style=\"font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px\">Approvals<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">4 <span style=\"font-size:13px;font-weight:500;color:rgba(255,255,255,.55)\">pending<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:4px;margin-top:12px\"><div style=\"width:18px;height:5px;border-radius:99px;background:#EFA84E\"><\u002Fdiv><div style=\"width:18px;height:5px;border-radius:99px;background:#EFA84E\"><\u002Fdiv><div style=\"width:18px;height:5px;border-radius:99px;background:#41C980\"><\u002Fdiv><div style=\"width:18px;height:5px;border-radius:99px;background:#41C980\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:12px;padding:16px 18px;min-width:150px\">\n          <div style=\"font-size:12px;color:rgba(255,255,2 Sign in to your eTech workspace<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n        <button onclick=\"{{ doLogin }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;color:var(--text)\" style-hover=\"background:var(--surface2)\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><rect x=\"0.5\" y=\"0.5\" width=\"7\" height=\"7\" fill=\"#F25022\"><\u002Frect><rect x=\"8.5\" y=\"0.5\" width=\"7\" height=\"7\" fill=\"#7FBA00\"><\u002Frect><rect x=\"0.5\" y=\"8.5\" width=\"7\" height=\"7\" fill=\"#00A4EF\"><\u002Frect><rect x=\"8.5\" y=\"8.5\" width=\"7\" height=\"7\" fill=\"#FFB900\"><\u002Frect><\u002Fsvg>\n          Continue with Microsoft\n        <\u002Fbutton>\n        <button onclick=\"{{ doLogin }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;color:var(--text)\" style-hover=\"background:var(--surface2)\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M8 1.8l5.5 2.4v3.4c0 3.3-2.3 5.7-5.5 6.6-3.2-.9-5.5-3.3-5.5-6.6V4.2z\"><\u002Fpath><path d=\"M5.8 8l1.6 1.6 2.8-3\"><\u002Fpath><\u002Fsvg>\n          Single sign-on (SSO)\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\"><div style=\"flex:1;height:1px;background:var(--border)\"><\u002Fdiv><span style=\"font-size:11.5px;color:var(--text3);font-weight:500;letter-spacing:.04em\">OR<\u002Fspan><div style=\"flex:1;height:1px;background:var(--border)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div>\n          <label style=\"display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:6px\">Work email<\u002Flabel>\n          <input type=\"email\" defaultvalue=\"alex.morgan@etech.io\" style=\"width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);font-size:14px\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n            <label style=\"font-size:12.5px;font-weight:600;color:var(--text2)\">Password<\u002Flabel>\n            <span style=\"font-size:12.5px;font-weight:500;color:var(--accent-text);cursor:pointer\" style-hover=\"text-decoration:underline\">Forgot password?<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"password\" defaultvalue=\"••••••••••\" style=\"width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--surface);font-size:14px\">\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none\">\n          <input type=\"checkbox\" defaultchecked=\"\" style=\"width:15px;height:15px;accent-color:var(--accent)\"> Keep me signed in for 30 days\n        <\u002Flabel>\n        <button onclick=\"{{ doLogin }}\" style=\"width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px\" style-hover=\"background:var(--accent-hover)\">Sign in<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:26px 0 0;font-size:12.5px;color:var(--text3);text-align:center\">Need access? Contact your workspace administrator<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ APP SHELL ============ -->\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:238px 1fr;height:100vh;min-width:1180px;overflow:hidden;background:var(--bg)\">\n\n  <!-- SIDEBAR -->\n  <aside style=\"display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;transition:background .25s;color:var(--text);{{ sideVars }}\">\n    <div style=\"display:flex;align-items:center;gap:9px;padding:2px 6px 0\">\n      <div style=\"width:27px;height:27px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff\">e<\u002Fdiv>\n      <div style=\"font-size:14.5px;font-weight:700;letter-spacing:-.01em\">eTech <span style=\"font-weight:500;color:var(--text3)\">Timesheet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div onclick=\"{{ openPalette }}\" style=\"display:flex;align-items:center;gap:8px;margin:16px 2px 6px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text3);font-size:13px;cursor:pointer\" style-hover=\"border-color:var(--border2)\">\n      <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"7\" cy=\"7\" r=\"4.5\"><\u002Fcircle><path d=\"M10.5 10.5L14 14\"><\u002Fpath><\u002Fsvg>\n      Search\n      <span style=\"margin-left:auto;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface);color:var(--text3)\">⌘K<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text3);padding:14px 8px 6px\">MY WORK<\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:2px\">\n      <div onclick=\"{{ go_dashboard }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:{{ navWt_dashboard }};color:{{ navFg_dashboard }};background:{{ navBg_dashboard }}\">\n        <svg width=\"16\" rk:'',billable:true,hours:''}]}}));\n  }\n  rmE(i){\n    const d=this.state.activeDay;\n    this.setState(s=>({entriesByDay:{...s.entriesByDay,[d]:(s.entriesByDay[d]||[]).filter((_,j)=>j!==i)}}));\n  }\n  setCell(ri,ci,val){\n    this.setState(s=>({weekRows:s.weekRows.map((r,i)=> i===ri? {...r,hours:r.hours.map((h,j)=> j===ci? (val===''?'':parseFloat(val)||0):h)}:r)}));\n  }\n  decide(id,st){\n    this.setState(s=>({approvals:s.approvals.map(a=>a.id===id?{...a,status:st}:a), sel:{...s.sel,[id]:false}}));\n    this.toast(st==='Approved'?'Timesheet approved':'Timesheet rejected — employee notified');\n  }\n\n  renderVals(){\n    const s=this.state, P=this.projects;\n    const v={};\n    const inkSide=s.sideTone==='dark';\n    // tweaks panel\n    v.tweaksOpen=s.tweaksOpen;\n    v.toggleTweaks=()=>this.setState(x=>({tweaksOpen:!x.tweaksOpen,notifOpen:false,paletteOpen:false}));\n    v.closeTweaks=()=>this.setState({tweaksOpen:false});\n    const curAccent=s.accentPick||(this.props.accent??'#4757E6');\n    v.accentOpts=[['#4757E6','Indigo'],['#0E9384','Teal'],['#B4441F','Rust'],['#7839EE','Violet']].map(([c,label])=>({\n      c,label,onClick:()=>this.setState({accentPick:c}),\n      ring:c===curAccent?'0 0 0 2px var(--surface), 0 0 0 4px '+c:'none'\n    }));\n    const seg=(opts,cur,fn)=>opts.map(([k,label])=>({label,onClick:()=>fn(k),\n      bg:cur===k?'var(--text)':'transparent',fg:cur===k?'var(--bg)':'var(--text2)'}));\n    v.toneOpts=seg([['light','Quiet'],['dark','Ink']],s.sideTone,(k)=>this.setState({sideTone:k}));\n    v.densityOpts=seg([['comfortable','Comfortable'],['compact','Compact']],s.density,(k)=>this.setState({density:k}));\n    v.uiZoom=s.density==='compact'?'0.86':'1';\n    v.sideVars=inkSide\n      ?'--surface:#10142E;--surface2:#1C2342;--border:#232A4E;--border2:#39416B;--text:#EEF1F5;--text2:#A9B0CE;--text3:#6E7699;--bg:#171D3B;--accent-soft:color-mix(in oklab, var(--accent) 32%, #10142E);--accent-text:color-mix(in oklab, var(--accent) 55%, #fff)'\n eDay];\n    const ents=s.entriesByDay[s.activeDay]||[];\n    v.hasEntries=ents.length>0; v.noEntries=ents.length===0;\n    v.entries=ents.map((e,i)=>({\n      key:i, pv:String(e.p), color:P[e.p].color,\n      onProject:(ev)=>this.updE(i,'p',parseInt(ev.target.value,10)),\n      task:e.task, onTask:(ev)=>this.updE(i,'task',ev.target.value),\n      desc:e.desc, onDesc:(ev)=>this.updE(i,'desc',ev.target.value),\n      start:e.start, onStart:(ev)=>this.updE(i,'start',ev.target.value),\n      end:e.end, onEnd:(ev)=>this.updE(i,'end',ev.target.value),\n      brk:e.brk, onBrk:(ev)=>this.updE(i,'brk',ev.target.value),\n      billable:e.billable, onBillable:()=>this.updE(i,'billable',!e.billable),\n      billLabel:e.billable?'Billable':'Non-bill.',\n      billBg:e.billable?'var(--green-soft)':'var(--surface2)',\n      billFg:e.billable?'var(--green)':'var(--text3)',\n      hours:e.hours===''?'':String(e.hours), onHours:(ev)=>this.updE(i,'hours',ev.target.value),\n      onRemove:()=>this.rmE(i)\n    }));\n    const dayTotal=ents.reduce((t,e)=>t+(parseFloat(e.hours)||0),0);\n    v.dayTotal=this.fmtH(dayTotal);\n    v.dayPct=Math.min(100,dayTotal/8*100)+'%';\n    v.dayBarColor=dayTotal>8?'var(--amber)':(dayTotal>=8?'var(--green)':'var(--accent)');\n    v.dayCountLabel=this.fmtH(dayTotal)+' / 8h logged';\n    v.dayRemainLabel=dayTotal>8? this.fmtH(dayTotal-8)+'h over standard day' : (dayTotal>=8?'Day complete ✓':this.fmtH(8-dayTotal)+'h remaining');\n    v.dayRemainColor=dayTotal>8?'var(--amber)':(dayTotal>=8?'var(--green)':'var(--text3)');\n    v.addEntry=()=>this.addE(0);\n    v.duplicateYesterday=()=>{\n      const d=s.activeDay;\n      if(d===0){this.toast('No previous day in this week');return;}\n      const prev=s.entriesByDay[d-1]||[];\n      if(!prev.length){this.toast('No entries to copy from yesterday');return;}\n      this.setState(x=>({entriesByDay:{...x.entriesByDay,[d]:prev.map(e=>({...e}))}}));\n      this.toast('Copied '+prev.length+' entries from yesterday');\n    };\n    v.saveDraft=()=>this.toast('Draft saved · auto-save is on');\n    v.submitDay=()=>this.toast('Day submitted for approval');\n    v.projectOptions=P.map((p,idx)=>({idx:String(idx),name:p.name}));\n    v.favProjects=[0,3,1,6].map(idx=>({name:P[idx].name.split('·')[0].trim(),color:P[idx].color,onClick:()=>{this.addE(idx);this.toast('Entry added — '+P[idx].name);}}));\n\n    // weekly\n    v.weekLabel=this.weekLabels[s.weekIdx];\n    v.prevWeek=()=>this.setState(x=>({weekIdx:Math.max(0,x.weekIdx-1)}));\n    v.nextWeek=()=>this.setState(x=>({weekIdx:Math.min(3,x.weekIdx+1)}));\n    const rowSums=s.weekRows.map(r=>r.hours.reduce((t,h)=>t+(parseFloat(h)||0),0));\n    v.weekRows=s.weekRows.map((r,ri)=>({\n      name:P[r.p].name, client:P[r.p].client, color:P[r.p].color, task:r.task,\n      total:this.fmtH(rowSums[ri])+'h',\n      cells:r.hours.map((h,ci)=>({\n        val:h===''?'':String(h),\n        onChange:(ev)=>this.setCell(ri,ci,ev.target.value),\n        bg:ci>=5?'var(--surface2)':'transparent'\n      })),\n      onRemoveRow:()=>this.setState(x=>({weekRows:x.weekRows.filter((_,j)=>j!==ri)}))\n    }));\n    const dayTotals=[0,1,2,3,4,5,6].map(ci=>s.weekRows.reduce((t,r)=>t+(parseFloat(r.hours[ci])||0),0));\n    v.dayTotals=dayTotals.map(t=>({val:t?this.fmtH(t):'—',color:t>=8?'var(--green)':(t>0?'var(--text)':'var(--text3)')}));\n    const wt=dayTotals.reduce((a,b)=>a+b,0);\n    v.weekTotal=this.fmtH(wt);\n    v.weekPct=Math.round(wt/40*100);\n    v.weekPctW=Math.min(100,wt/40*100)+'%';\n    v.weekRemaining=this.fmtH(Math.max(0,40-wt));\n    v.ringDash=(Math.min(100,wt/40*100)/100*351.9).toFixed(1);\n    v.weekStatus=s.weekStatus;\n    const wchip={Draft:['var(--surface2)','var(--text2)'],Pending:['var(--amber-soft)','var(--amber)'],Approved:['var(--green-soft)','var(--green)']};\n    v.weekStatusBg=wchip[s.weekStatus][0]; v.weekStatusFg=wchip[s.weekStatus][1];\n    v.canSubmit=s.weekStatus==='Draft';\n    v.submitLabel=s.weekStatus==='Draft'?'Submit for approval':(s.weekStatus==='Pending'?'Submitted · awaiting review':'Approved');\n    v.submitBg=s.weekStatus==='Draft'?'var(--accent)':'var(--surface2)';\n    v.submitFg=s.weekStatus==='Draft'?'#fff':'var(--text3)';\n    v.submitCursor=s.weekStatus==='Draft'?'pointer':'default';\n    v.submitWeek=()=>{ if(s.weekStatus!=='Draft')return; this.setState({weekStatus:'Pending'}); this.toast('Timesheet submitted — pending approval'); };\n    v.addWeekRow=()=>this.setState(x=>({weekRows:[...x.weekRows,{p:6,task:'',hours:['','','','','','','']}]}));\n    v.exportPdf=()=>this.toast('Exporting PDF…');\n    v.exportXls=()=>this.toast('Exporting Excel…');\n    v.printSheet=()=>this.toast('Sending to print…');\n\n    // approvals\n    const achip={Pending:['var(--amber-soft)','var(--amber)'],Approved:['var(--green-soft)','var(--green)'],Rejected:['var(--red-soft)','var(--red)']};\n    v.approvals=s.approvals.map(a=>({\n      ...a,\n      hoursLabel:this.fmtH(a.hours)+'h',\n      billableLabel:a.billable+'%',\n      avBg:this.avColors[a.initials]||'#475467',\n      statusBg:achip[a.status][0], statusFg:achip[a.status][1],\n      isPending:a.status==='Pending',\n      hasFlag:!!a.flag,\n      checked:!!s.sel[a.id],\n      checkBg:s.sel[a.id]?'var(--accent)':'transparent',\n      checkBorder:s.sel[a.id]?'var(--accent)':'var(--border2)',\n      rowBg:s.sel[a.id]?'var(--accent-soft)':'transparent',\n      onSelect:()=>this.setState(x=>({sel:{...x.sel,[a.id]:!x.sel[a.id]}})),\n      onApprove:()=>this.decide(a.id,'Approved'),\n      onReject:()=>this.decide(a.id,'Rejected')\n    }));\n    const selIds=Object.keys(s.sel).filter(id=>s.sel[id]);\n    v.selCount=selIds.length;\n    v.showBulk=selIds.length>0;\n    v.selCountLabel=selIds.length+' selected';\n    v.bulkApprove=()=>{\n      this.setState(x=>({approvals:x.approvals.map(a=>selIds.includes(a.id)&&a.status==='Pending'?{...a,status:'Approved'}:a),sel:{}}));\n      this.toast(selIds.length+' timesheets approved');\n    };\n    v.clearSel=()=>this.setState({sel:{}});\n    v.pendingCount=s.approvals.filter(a=>a.status==='Pending').length;\n    v.showApprBadge=v.pendingCount>0;\n    v.pendingHours=this.fmtH(s.approvals.filter(a=>a.status==='Pending').reduce((t,a)=>t+a.hours,0));\n\n    // manager\n    v.missing=[\n      {name:'Tom Okafor',dept:'Data · 2 weeks overdue',initials:'TO',bg:this.avColors.TO,sev:'var(--red)',onRemind:()=>this.toast('Reminder sent to Tom Okafor')},\n      {name:'Amy Park',dept:'Engineering · due today',initials:'AP',bg:this.avColors.AP,sev:'var(--amber)',onRemind:()=>this.toast('Reminder sent to Amy Park')},\n      {name:'Marcus Webb',dept:'Engineering · this week',initials:'MW',bg:this.avColors.MW,sev:'var(--amber)',onRemind:()=>this.toast('Reminder sent to Marcus Webb')}\n    ];\n\n    // projects\n    const chips=['All','Running','At risk','Completed'];\n    const real=P.filter(p=>p.client!=='eTech');\n    const riskSet=['At risk','Over budget','Delayed'];\n    const matches=(p)=> s.projFilter==='All'?true : s.projFilter==='Running'? p.health!=='Completed' : s.projFilter==='At risk'? riskSet.includes(p.health) : p.health==='Completed';\n    v.projChips=chips.map(c=>{\n      const n=real.filter(p=> c==='All'?true : c==='Running'? p.health!=='Completed' : c==='At risk'? riskSet.includes(p.health) : p.health==='Completed').length;\n      const a=s.projFilter===c;\n      return {label:c+' · '+n, onClick:()=>this.setState({projFilter:c}),\n        bg:a?'var(--text)':'var(--surface)', fg:a?'var(--bg)':'var(--text2)', border:a?'var(--text)':'var(--border2)'};\n    });\n    const hchip={'On track':['var(--green-soft)','var(--green)'],'At risk':['var(--amber-soft)','var(--amber)'],'Over budget':['var(--red-soft)','var(--red)'],'Delayed':['var(--red-soft)','var(--red)'],'Completed':['var(--surface2)','var(--text2)']};\n    v.projCards=real.filter(matches).map(p=>{\n      const rem=p.est-p.act;\n      const bpct=p.budget?Math.round(p.spent/p.budget*100):0;\n      return {\n        n
